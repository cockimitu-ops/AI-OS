<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace">
  <rect width="1200" height="630" fill="#0F1A18"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#4A6560" stroke-opacity="0.4"/>

  <!-- Price ladder: real competitor prices from the worked example -->
  <g>
    <line x1="200" y1="480" x2="480" y2="480" stroke="#4A6560" stroke-opacity="0.5"/>
    <g fill="#7E9691" font-size="12" letter-spacing="1px">
      <text x="200" y="505">$19</text><text x="290" y="505">$29</text>
      <text x="380" y="505">$49</text><text x="455" y="505">$99</text>
    </g>
    <rect x="200" y="424" width="34" height="46" fill="#7E9691" fill-opacity="0.35"/>
    <rect x="248" y="400" width="34" height="70" fill="#7E9691" fill-opacity="0.35"/>
    <rect x="296" y="330" width="34" height="140" fill="#3FBF9F"/>
    <rect x="344" y="392" width="34" height="78" fill="#7E9691" fill-opacity="0.35"/>
    <rect x="392" y="440" width="34" height="30" fill="#7E9691" fill-opacity="0.35"/>
    <rect x="440" y="452" width="34" height="18" fill="#7E9691" fill-opacity="0.35"/>
    <text x="313" y="312" fill="#3FBF9F" font-size="13" text-anchor="middle" letter-spacing="1px">YOU</text>
    <line x1="313" y1="300" x2="313" y2="270" stroke="#3FBF9F" stroke-width="1.5"/>
    <text x="313" y="258" fill="#E9E7E0" font-size="14" text-anchor="middle">defensible</text>
  </g>

  <g fill="#7E9691" font-size="12" letter-spacing="1px">
    <text x="200" y="545">MARKET DENSITY</text>
  </g>

  <text x="640" y="188" fill="#7E9691" font-size="14" letter-spacing="3px">PRICING RESEARCH SYSTEM</text>
  <text x="638" y="272" fill="#E9E7E0" font-size="60" font-weight="700">The Pricing</text>
  <text x="638" y="338" fill="#3FBF9F" font-size="60" font-weight="700">Teardown</text>

  <g fill="#BFC9C6" font-size="21" font-family="Helvetica, Arial, sans-serif">
    <text x="640" y="392">Decide what to charge —</text>
    <text x="640" y="420">and be able to defend it.</text>
  </g>

  <line x1="640" y1="462" x2="1130" y2="462" stroke="#4A6560" stroke-opacity="0.4"/>
  <g fill="#7E9691" font-size="13" letter-spacing="1.5px">
    <text x="640" y="496">6 MODULES</text>
    <text x="790" y="496">·</text>
    <text x="808" y="496">PROMPTS INCLUDED</text>
    <text x="640" y="524" fill="#3FBF9F" font-size="20" font-weight="700">$29</text>
  </g>
</svg>
